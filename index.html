<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>쇼츠 길이 측정기</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F7E7B4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="쇼츠 길이">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* B안: 조금 투박하되 담백한 손그림 톤. 13 mini(375×812) 기준 */
  :root { --ink: #3B2A1E; --acc: #E8553D; --cream: #FFF8EA; --paper: #FBF5E8; --ok: #4F8A3C; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Gaegu", sans-serif; letter-spacing: -0.05em; }   /* Gaegu는 기본 자간이 넓어 보여서 좁힘 */
  .lede, .intro .lede, .finale .fs, .hud .sub, .fileMeta, .anal-n, .range, .verdict, .foot { letter-spacing: -0.09em; word-spacing: 0.08em; }   /* Gaegu 본문: 글자 사이만 좁히고 단어 사이는 유지 */
  .btn, .q, h1, h2, h3, .fileName, .fileOk, .anal-t, .hud .alt, .finale .fn, .finale .pill, .ladder .n, .ladder .r { letter-spacing: -0.01em; }   /* Jua는 원래 자간 유지 */
  .stage { position: relative; height: 100dvh; min-height: 560px; overflow: hidden; }
  #cv { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; left: 18px; top: calc(48px + env(safe-area-inset-top, 0px)); pointer-events: none; opacity: 0; transition: opacity .4s; }
  .hud.on { opacity: 1; }
  .hud .alt { font-family: "Jua", sans-serif; font-size: 46px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .hud .sub { font-weight: 700; font-size: 16px; opacity: .78; }
  .intro { position: absolute; left: 24px; right: 24px; top: env(safe-area-inset-top, 0px); bottom: calc(30px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: opacity .4s, transform .4s; }
  .intro .title { font-family: "Jua", sans-serif; font-size: 64px; line-height: 1.02; letter-spacing: -1px; }
  .intro .title b { color: var(--acc); font-weight: 400; }
  .intro .q { font-family: "Jua", sans-serif; font-size: 21px; margin: 12px 0 0; opacity: .85; }
  .intro .lede { margin: 16px 0 0; font-size: 17px; }
  .introBtns { margin-top: 24px; display: flex; gap: 10px; justify-content: center; min-height: 48px; }
  .introBtns .btn { font-size: 19px; padding: 11px 24px 13px; }
  .intro .fileCard { width: 100%; text-align: left; display: flex; box-sizing: border-box; max-height: 0; padding-top: 0; padding-bottom: 0; margin-top: 0; border-width: 0; box-shadow: none; overflow: hidden; opacity: 0;
    transition: max-height .35s ease, padding .35s ease, margin .35s ease, opacity .25s .1s; }
  .intro .fileCard.on { max-height: 90px; padding-top: 12px; padding-bottom: 12px; margin-top: 22px; border-width: 2.5px; box-shadow: 0 3px 0 var(--ink); opacity: 1; }   /* 카드가 펼쳐지며 묶음 전체가 부드럽게 위로 */
  @media (max-height: 720px) { .intro .title { font-size: 54px; } }
  .intro.off { opacity: 0; transform: translateY(-12px); pointer-events: none; }
  .eyebrow { font-weight: 700; font-size: 16px; color: var(--acc); }
  h1 { font-family: "Jua", sans-serif; font-weight: 400; font-size: 36px; line-height: 1.18; margin: 4px 0 12px; }
  h1 b { color: var(--acc); font-weight: 400; }
  .lede { font-weight: 700; font-size: 18px; line-height: 1.35; opacity: .82; margin: 0 0 8px; }
  .note { font-size: 15px; opacity: .6; margin: 0; }
  details { margin-top: 10px; font-size: 15px; line-height: 1.4; }
  summary { cursor: pointer; font-weight: 700; text-decoration: underline; }
  details ol { padding-left: 18px; margin: 6px 0 0; background: rgba(255,248,234,.85); border-radius: 10px; padding: 8px 8px 8px 26px; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; justify-content: center;
    padding: 12px 12px calc(14px + env(safe-area-inset-bottom, 0px)); transition: opacity .3s; }
  .bar.off { opacity: 0; pointer-events: none; }
  .btn { appearance: none; font-family: "Jua", sans-serif; font-size: 17px; color: var(--ink); background: var(--cream);
    border: 2.5px solid var(--ink); border-radius: 14px; padding: 9px 18px 11px; box-shadow: 0 3px 0 var(--ink); cursor: pointer; }
  .btn.main { background: var(--acc); color: #fff; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .fileCard { display: none; margin-top: 18px; background: var(--cream); border: 2.5px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink); padding: 12px 14px; align-items: center; gap: 12px; }
  .fileCard.on { display: flex; }
  .fileIco { width: 34px; height: 42px; border: 2.5px solid var(--ink); border-radius: 5px 12px 5px 5px; background: #fff; position: relative; flex: none; }
  .fileIco::after { content: "HTML"; position: absolute; left: -6px; bottom: 5px; background: var(--acc); color: #fff; font: 700 9px/1 "Jua", sans-serif; padding: 3px 4px; border-radius: 4px; }
  .fileName { font-family: "Jua", sans-serif; font-size: 18px; }
  .fileMeta { white-space: nowrap; font-size: 14px; opacity: .65; font-weight: 700; }
  .fileOk { margin-left: auto; white-space: nowrap; font-family: "Jua", sans-serif; color: var(--acc); font-size: 15px; }
  .anal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,248,234,.55); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .anal.on { opacity: 1; pointer-events: auto; }
  .anal-card { width: 250px; background: var(--cream); border: 2.5px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); padding: 18px 18px 16px; text-align: center; }
  .anal-t { font-family: "Jua", sans-serif; font-size: 21px; }
  .anal-n { font-weight: 700; font-size: 15px; opacity: .7; margin: 4px 0 12px; font-variant-numeric: tabular-nums; }
  .anal-bar { height: 12px; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; background: #fff; }
  .anal-bar i { display: block; height: 100%; width: 0; background: var(--acc); }
  .err { position: absolute; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); text-align: center; font-weight: 700; color: var(--acc); }
  /* 도착 화면 A안: 숫자 포스터 */
  .finale { position: absolute; left: 0; right: 0; top: calc(86px + env(safe-area-inset-top, 0px)); text-align: center; pointer-events: none; opacity: 0; transform: translateY(12px); transition: opacity .5s, transform .6s cubic-bezier(.2,.8,.2,1); }
  .finale.on { opacity: 1; transform: none; }
  .finale .fk { font-family: "Jua", sans-serif; font-size: 27px; letter-spacing: -0.01em; color: var(--cream);   /* 하늘 위에서도 잘 읽히게: 밝은 크림색 + 잉크 외곽선 */
    text-shadow: -2px 0 0 var(--ink), 2px 0 0 var(--ink), 0 -2px 0 var(--ink), 0 2px 0 var(--ink), -1.5px -1.5px 0 var(--ink), 1.5px -1.5px 0 var(--ink), -1.5px 1.5px 0 var(--ink), 1.5px 1.5px 0 var(--ink), 0 4px 0 var(--ink); }
  .finale .fn { font-family: "Jua", sans-serif; font-size: 96px; line-height: 1.08; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .finale .fs { display: flex; flex-direction: column; align-items: center; gap: 0; margin-top: 0; white-space: nowrap; }   /* 원래처럼 글자만, 두 줄로 나눠 크기만 키움 */
  .finale .fs b { font-weight: 700; font-size: 19px; }
  .finale .fs span { font-weight: 700; font-size: 15px; opacity: .72; }
  .finale .pill { display: inline-block; margin-top: 12px; background: var(--acc); color: #fff; font-family: "Jua", sans-serif; font-size: 22px; padding: 9px 18px 11px; border: 2.5px solid var(--ink); border-radius: 999px; box-shadow: 0 3px 0 var(--ink); transform: rotate(-2deg) scale(.6); opacity: 0; transition: transform .45s cubic-bezier(.3,1.6,.5,1) .35s, opacity .2s .35s; }
  .finale.on .pill { transform: rotate(-2deg) scale(1); opacity: 1; }
  .arrive[hidden] { display: none; }
  .arrive { position: absolute; left: 12px; right: 12px; bottom: calc(78px + env(safe-area-inset-bottom, 0px)); background: var(--cream);
    border: 2.5px solid var(--ink); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); padding: 14px 16px 12px;
    transform: translateY(150%); transition: transform .7s cubic-bezier(.2,.8,.2,1); }
  .arrive.on { transform: none; }
  .arrive h2 { font-family: "Jua", sans-serif; font-weight: 400; font-size: 24px; line-height: 1.25; margin: 0 0 6px; }
  .arrive h2 b { color: var(--acc); font-weight: 400; }
  .arrive canvas { display: block; width: 100%; height: 170px; }
  .arrive .tiny { font-size: 13px; opacity: .65; margin-top: 2px; }
  .res { padding: 56px 24px calc(28px + env(safe-area-inset-bottom, 0px)); max-width: 480px; margin: 0 auto; }
  .panel { background: var(--cream); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 0 3px 0 var(--ink); padding: 12px 16px 14px; margin-top: 16px; }
  .panel h3 { font-family: "Jua", sans-serif; font-weight: 400; font-size: 19px; margin: 0 0 6px; }
  .range { font-size: 14px; opacity: .6; margin: 0 0 4px; }
  .verdict { font-weight: 700; font-size: 17px; line-height: 1.4; margin: 0; opacity: .88; }
  .ladder { list-style: none; margin: 0; padding: 0; }
  .ladder li { display: grid; grid-template-columns: 18px 1fr 64px auto; gap: 6px; align-items: center; padding: 6px; border-radius: 8px; }
  .ladder .i { font-weight: 700; text-align: center; }
  .ladder .n { font-family: "Jua", sans-serif; font-size: 15px; }
  .ladder .h { font-weight: 700; font-size: 14px; opacity: .55; }
  .ladder .r { font-family: "Jua", sans-serif; font-size: 14px; text-align: right; }
  .ladder li.ok .i, .ladder li.ok .r { color: var(--ok); }
  .ladder li.next { background: rgba(246,184,168,.45); outline: 1.5px solid var(--ink); }
  .ladder li.next .i, .ladder li.next .r { color: var(--acc); }
  .foot { font-size: 13px; line-height: 1.4; opacity: .6; margin: 16px 0; }
  .bar2 { display: flex; gap: 10px; justify-content: center; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud"><div class="alt" id="alt">0m</div><div class="sub" id="sub"></div></div>
  <div class="intro" id="intro">
    <div class="title">쇼츠 <b>길이</b><br>측정기</div>
    <p class="q">내가 본 쇼츠, 어디까지 닿을까?</p>
    <p class="lede">1년 동안 본 쇼츠를 한 칸씩<br>세로로 이어 붙여 길이를 재봐요.</p>
    <div class="fileCard" id="fileCard"><div class="fileIco"></div><div><div class="fileName">시청 기록.html</div><div class="fileMeta" id="fileMeta"></div></div><div class="fileOk">선택됨</div></div>
    <div class="introBtns" id="introBtns"></div>
  </div>
  <div class="finale" id="finale"><div class="fk">1년 동안 본 쇼츠 길이</div><div class="fn" id="finN"></div><div class="fs" id="finS"></div><div class="pill" id="finP"></div></div>
  <div class="arrive" id="arrive" hidden><h2 id="arriveTitle"></h2><canvas id="lineup"></canvas><div class="tiny" id="tiny"></div></div>
  <div class="err" id="err"></div>
  <div class="anal" id="anal"><div class="anal-card"><div class="anal-t">시청 기록 분석 중…</div><div class="anal-n" id="analN">0%</div><div class="anal-bar"><i id="analBar"></i></div></div></div>
  <div class="bar" id="bar"></div>
  <input type="file" id="file" accept=".html,.htm,.json" hidden>
</div>
<section class="res" id="res" hidden>
  <div class="eyebrow">결과</div>
  <h1 id="resTitle"></h1>
  <div class="panel"><h3>판정</h3><p class="range" id="range"></p><p class="verdict" id="verdict"></p></div>
  <div class="panel"><h3>고도표</h3><ul class="ladder" id="ladder"></ul></div>
  <p class="foot">한 칸 = 화면 세로 길이 (6.3인치 기준 14.5cm). 쇼츠 판정: 다음 영상을 90초 안에 틀었으면 쇼츠. 마지막 기록부터 1년 동안의 기록만 셉니다.</p>
  <div class="bar2"><button class="btn main" type="button" data-act="replay">다시 올라가기</button><button class="btn" type="button" data-act="pick">내 기록 넣기</button></div>
</section>

const SHORTS = [['#F2A65A', '#7A3E1D'], ['#4B5D73', '#15191F'], ['#D9583B', '#4A1A10'], ['#3FB6C4', '#0F4C5C'], ['#B460D6', '#3A1452'], ['#3FD07A', '#0E2A1C']];

// 고도 → 하늘색: 노랑 → 하늘색 → 남색 → 검은 우주
const SKY = [[1, '#F7E7B4'], [300, '#F4E8C4'], [1500, '#D3E7E4'], [4000, '#A9D4EC'], [10000, '#5E95CC'], [20000, '#2E4A86'], [35000, '#10173A'], [60000, '#06070C']]   // 실제 하늘처럼 20km 남색, 35km 거의 검정
  .map(([a, h]) => [a, [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16))]);

/* ===== 유틸 ===== */
const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('ko-KR');
const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const ease = t => -(Math.cos(Math.PI * Math.max(0, Math.min(1, t))) - 1) / 2;
const mix = (A, B, t) => A.map((v, i) => v + (B[i] - v) * t);
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const hexArr = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const INK_A = hexArr(INK), CREAM_A = hexArr(CREAM);
function skyAt(alt) {
  const la = Math.log10(Math.max(alt, 1));
  for (let i = 0; i < SKY.length - 1; i++) {
    const [a, ca] = SKY[i], [b, cb] = SKY[i + 1];
    if (alt <= b) return mix(ca, cb, Math.max(0, (la - Math.log10(a)) / (Math.log10(b) - Math.log10(a))));
  }
  return SKY[SKY.length - 1][1];
}
const lum = c => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
const inkOn = bg => mix(INK_A, CREAM_A, 1 - smooth(0.3, 0.62, lum(bg)));   // 배경 밝기에 따라 잉크↔크림 자연스럽게
const hfmt = h => h < 1 ? Math.round(h * 100) + 'cm' : h >= 10000 ? fmt(h / 1000) + 'km' : (h < 10 ? (+h.toFixed(2)) + 'm' : fmt(h) + 'm');

    ctx.save(); ctx.setLineDash([7, 6]); ctx.strokeStyle = rgb(inkOn(skyAt(o.h)), 0.6); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); ctx.restore();
    sticker(o.name, hfmt(o.h), W - 70, y - 6, 1, -0.03);
  }
  // 실제 비율 오브젝트: 다음 상대는 오른쪽에서 들어오고, 넘은 것은 작아지며 뒤로 빠짐
  const slot = W * 0.72, next = GROUND.find(o => o.h > h && TL.shown.has(o)), devH = DEV_H_M * c.ppm;
  for (const o of GROUND) {
    if (!TL.shown.has(o)) continue;
    if (TL.top && o.h > TL.top.h) continue;   // 데모: 도착 지점 위의 오브젝트는 그리지 않음
    const isTop = o === TL.top, p = h / o.h, hPx = o.h * c.ppm, asp = isTop && !o.img ? Math.min(o.aspect, W * 0.7 / Math.max(hPx, 1)) : o.aspect, w = hPx * asp;
    const tA = TL.enterT.get(o); if (!(t >= tA) || hPx < 1.2) continue;   // 등장 시각 전엔 안 그림
    const lim = Math.min(gy, H) - TOP_PAD + 60;
    // 오른쪽 화면 밖에서 튀어나와(살짝 지나쳤다 제자리) 멈춤. 이후 위치 고정
    const ent = Math.min(1, (t - tA) / ENTER_MS), x0 = isTop ? BARX() + 14 + Math.min(w, W * 0.7) / 2 : slot;
    const x = x0 + (1 - easeOutBack(ent)) * (W + Math.min(w, W) * 0.3 - x0);   // 첫 프레임부터 오른쪽 끝에 살짝 보이게 (빈 화면 방지)
    const up = easeOut(ent);
    let alpha = smooth(1.2, 8, hPx);
    if (MOTION === 'fold') {                            // 시안 테스트용(#fold): 일어서고 뒤로 넘어가는 종이판
      const tp = TL.passT.get(o), down = isTop || p < 1 ? 0 : easeIn(smooth(tp, tp + FALL_MS, t)), fold = up * (1 - down);
      if (fold < 0.02) continue;
      drawFold(isTop ? { ...o, aspect: asp } : o, x, gy, hPx, alpha, fold, down);
    } else {                                            // 기본: 오른쪽에서 튀어나오고, 넘으면 바로 흐려짐
      if (p > 1 && !isTop) { const lv = TL.leaveT.get(o) ?? TL.passT.get(o) + 60; alpha *= 1 - smooth(lv, lv + FADE_MS, t); }   // 넘은 뒤 다음 오브젝트가 들어오면 흐려져 사라짐
      drawObj(isTop ? { ...o, aspect: asp } : o, x, gy, hPx, alpha);
    }
    const rival = o === next && (p > 0.35 || o.h <= 0.1);
    const justPassed = MOTION !== 'fold' && p >= 1 && p < 2.2;
    if (rival || justPassed || (isTop && p >= 1)) sticker(o.name, hfmt(o.h), x, Math.max(TOP_PAD - 10, gy - hPx - 8), (rival ? up : isTop ? 1 : 1 - smooth(1.5, 2.2, p)) * alpha, -0.05);
  }
  // 떠 있는 오브젝트 (보기 좋은 고정 크기, 지금은 자리 표시)
  for (const o of OBJECTS) if (o.kind === 'float' && TL.shown.has(o)) {
    const y = yOf(o.h, c); if (y < TOP_PAD - 50 || y > Math.min(gy, H) - 30) continue;
    const lv = TL.leaveT.get(o) ?? passTime(o.h) + 60, tE = TL.enterT.get(o) ?? 0, x = W * 0.56, fa = smooth(tE, tE + 50, t) * (1 - smooth(lv, lv + FADE_MS, t));   // 다음 오브젝트가 들어오면 흐려짐
    if (fa < 0.02) continue;
    ctx.save(); ctx.globalAlpha = fa;
    if (o.img && o.img.complete && o.img.naturalWidth) { const fh = 120, fw = fh * o.aspect; ctx.drawImage(o.img, x - fw / 2, y - fh / 2, fw, fh); ctx.restore(); sticker(o.name, hfmt(o.h), x, y - fh / 2 - 6, fa, 0.04); continue; }   // 떠 있는 것은 보기 좋은 고정 크기
    ctx.save(); ctx.fillStyle = 'rgba(242,227,198,.92)'; ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.ellipse(x, y, 26, 16, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore(); ctx.restore();
    sticker(o.name, hfmt(o.h), x, y - 20, fa, 0.04);
  }
  // 땅
  if (gy < H) { ctx.fillStyle = '#A3B86C'; ctx.fillRect(0, gy, W, H - gy); ctx.fillStyle = INK; ctx.fillRect(0, gy - 1.5, W, 3); }
  // 막대 + 폰/핀
  drawBar(h, c);
  const phoneA = smooth(22, 34, devH);
  drawPhone(h, c, phoneA);
  drawPin(BARX(), yOf(h, c), 1 - phoneA);
  // HUD (배경 밝기에 따라 글자색 보간)
  const hudBg = skyAt(Math.max(0, altAtY(90, c))), kC = 1 - smooth(0.66, 0.82, lum(hudBg));   // HUD는 일찍 밝아지게: 후지산 다가올 무렵(하늘 밝기 0.82→0.66) 크림색으로 다 바뀜
  const col = rgb(mix(INK_A, CREAM_A, kC));
  const hud = $('hud'); hud.style.color = col; hud.style.textShadow = kC > 0.02 ? `0 2px 0 rgba(59,42,30,${(0.45 * kC).toFixed(2)})` : 'none';
  $('alt').textContent = h >= 10000 ? (h / 1000).toFixed(1) + 'km' : (h < 10 ? h.toFixed(2) : fmt(h)) + 'm';
  $('sub').textContent = `쇼츠 ${fmt(Math.min(n, (data || EXAMPLE).shorts))}편 × ${(UNIT * 100).toFixed(1)}cm`;
}

/* ===== 도착 카드 · 결과 ===== */
function topPassed() { const d = TL.dist, p = GROUND.filter(o => o.h <= d); return { passed: p, top: p[p.length - 1] }; }
function showArrive(on) {   // A안: 카드 대신 화면 위쪽에 큰 숫자 + 배수 태그
  const fin = $('finale'); $('arrive').classList.remove('on');
  if (!on) { fin.classList.remove('on'); return; }
  const { top } = topPassed(), d = data || EXAMPLE, f2 = s2 => s2.replace(/-/g, '.').slice(2);
  $('finN').textContent = (TL.dist >= 10000 ? (TL.dist / 1000).toFixed(1) + 'km' : fmt(TL.dist) + 'm');
  $('finS').innerHTML = `<b>쇼츠 ${fmt(d.shorts)}편 × ${(UNIT * 100).toFixed(1)}cm</b><span>${f2(d.from)} – ${f2(d.to)}</span>`;
  if (top) { const mult = TL.dist / top.h, m = mult >= 10 ? Math.round(mult) : +mult.toFixed(1); $('finP').textContent = mult >= 1.05 ? `${top.name} ${m}개 높이` : `${top.name} 높이`; }
  fin.style.color = INK;
  $('hud').classList.remove('on'); fin.classList.add('on');
}
function showLineupCard() {   // (이전 도착 카드: 지금은 안 씀)
  const box = $('arrive');
  const { passed, top } = topPassed(); if (!top) return;
  const mult = TL.dist / top.h, m = mult >= 10 ? Math.round(mult) : +mult.toFixed(1);
  $('arriveTitle').innerHTML = mult >= 1.05 ? `1년 동안 <b>${top.name} ${m}개</b><br>높이만큼 쇼츠를 봤다` : `1년 동안 <b>${top.name}</b><br>높이만큼 쇼츠를 봤다`;
  const shown = passed.filter(o => o.h / top.h >= 0.03).slice(-6), hidden = passed.filter(o => !shown.includes(o));
  const lc = $('lineup'), r = lc.getBoundingClientRect(), c2 = lc.getContext('2d');
  lc.width = r.width * DPR; lc.height = r.height * DPR; c2.setTransform(DPR, 0, 0, DPR, 0, 0); c2.clearRect(0, 0, r.width, r.height);
  // 모두 같은 비율(px/m)로 세움. 가로로 넓은 산(후지산 등)이 들어가도록 폭을 나눠 씀. 작은 건 라벨 폭만큼 자리 확보
  const base = r.height - 22, LW = 56, top0 = shown[shown.length - 1];
  const realW = o => o.h * (o.img ? o.aspect : Math.min(o.aspect, 1.2));
  const label = (o, cx, gap) => { c2.fillStyle = INK; c2.globalAlpha = .8; c2.font = '700 12px Gaegu'; c2.textAlign = 'center'; const full = o.short || o.name; let nm = full; while (nm.length > 2 && c2.measureText(nm).width > gap - 4) nm = nm.slice(0, -1); if (nm !== full) nm = nm.slice(0, -1) + '…'; c2.fillText(nm, cx, r.height - 4); c2.globalAlpha = 1; };
  if (top0.img && realW(top0) * (base - 6) / top0.h > r.width * 0.6) {   // 도착 산이 옆으로 넓으면(후지산 사진): 산을 뒤에 크게 깔고, 나머지는 그 앞에 같은 비율로 세움
    const sc2 = (base - 6) * 0.82 / top0.h, peakX = r.width * 0.74, rest = shown.slice(0, -1), gap = r.width * 0.56 / Math.max(rest.length, 1);
    drawObj(top0, peakX, base, top0.h * sc2, 1, c2);
    rest.forEach((o, i) => { const cx = gap * i + gap / 2, hp = Math.max(o.h * sc2, 4); drawObj(o.img ? o : { ...o, aspect: Math.min(o.aspect, 1.2, gap * 0.92 / hp) }, cx, base, hp, 1, c2); label(o, cx, gap + 12); });
    label(top0, peakX, r.width * 0.4);
    c2.fillStyle = INK; c2.fillRect(0, base, r.width, 2);
    $('tiny').textContent = hidden.length ? `같은 비율로 세우면 ${hidden.slice(0, 2).map(o => o.name).join('·')} 등 ${hidden.length}개는 너무 작아서 안 보여요.` : '';
    return;
  }
  let sc = (base - 6) / top0.h;
  for (let k = 0; k < 4; k++) {
    const slots = shown.map(o => Math.max(LW, realW(o) * sc + 8)), tot = slots.reduce((a, b) => a + b, 0);
    if (tot <= r.width) break;
    const fixed = shown.reduce((a, o) => a + (realW(o) * sc + 8 <= LW ? LW : 8), 0), big = shown.reduce((a, o) => a + (realW(o) * sc + 8 <= LW ? 0 : realW(o)), 0);
    sc = Math.min(sc, (r.width - fixed) / Math.max(big, 1e-6));
  }
  const slots = shown.map(o => Math.max(LW, realW(o) * sc + 8)), extra = Math.max(0, r.width - slots.reduce((a, b) => a + b, 0)) / shown.length;
  let xc = 0;
  shown.forEach((o, i) => {
    const gap = slots[i] + extra, cx = xc + gap / 2; xc += gap;
    const hp = Math.max(o.h * sc, 4);
    drawObj(o.img ? o : { ...o, aspect: Math.min(o.aspect, 1.2, gap * 0.92 / hp) }, cx, base, hp, 1, c2);
    c2.fillStyle = INK; c2.globalAlpha = .8; c2.font = '700 12px Gaegu'; c2.textAlign = 'center'; const full = o.short || o.name; let nm = full; while (nm.length > 2 && c2.measureText(nm).width > gap - 4) nm = nm.slice(0, -1); if (nm !== full) nm = nm.slice(0, -1) + '…'; c2.fillText(nm, cx, r.height - 4); c2.globalAlpha = 1;
  });
  c2.fillStyle = INK; c2.fillRect(0, base, r.width, 2);
  $('tiny').textContent = hidden.length ? `같은 비율로 세우면 ${hidden.slice(0, 2).map(o => o.name).join('·')} 등 ${hidden.length}개는 너무 작아서 안 보여요.` : '';
  
}
function buildResult() {
  const d = data || EXAMPLE, dist = TL.dist, { top } = topPassed(), next = OBJECTS.find(o => o.kind !== 'line' && o.h > dist), space = 100000;
  $('resTitle').innerHTML = `1년 동안 본 쇼츠 길이<br><b>${lenFmt(dist)}</b>`;
  $('range').textContent = `${d.from.replaceAll('-', '.')} – ${d.to.replaceAll('-', '.')} · 쇼츠 ${fmt(d.shorts)}편`;
  const lines = [];
  if (top) lines.push(`${top.name}(${hfmt(top.h)})의 ${(dist / top.h).toFixed(1)}배 길이.`);
  if (next) lines.push(`${next.name} 높이까지 쇼츠 ${fmt(Math.ceil((next.h - dist) / UNIT))}편 남았어요.`);
  lines.push(dist < space ? `우주까지는 ${fmt(Math.ceil((space - dist) / UNIT))}편.` : '우주까지 넘었어요.');
  $('verdict').innerHTML = lines.join('<br>');
  const list = OBJECTS.filter(o => o.kind !== 'line'), ni = list.findIndex(o => o.h > dist), end = ni < 0 ? list.length : ni;
  const rows = list.slice(Math.max(0, end - 5), Math.min(list.length, end + 3));
  $('ladder').innerHTML = rows.map(o => { const ok = o.h <= dist, nx = o === list[ni];
    return `<li class="${ok ? 'ok' : ''}${nx ? ' next' : ''}"><span class="i">${ok ? '✓' : nx ? '▲' : '·'}</span><span class="n">${o.name}</span><span class="h">${hfmt(o.h)}</span><span class="r">${ok ? '통과' : '+' + fmt(Math.ceil((o.h - dist) / UNIT)) + '편'}</span></li>`; }).join('');
  $('res').hidden = false;
}

/* ===== 상태 ===== */
function setBar(state) {
  const b = $('bar');
  const items = state === 'start' ? [['pick', '내 시청 기록 넣기', 1]] : state === 'ready' ? [['analyze', '분석하기', 1]] : state === 'arrived' ? [['result', '결과 자세히 보기', 1], ['replay', '다시', 0]] : [];
  const html = items.map(([a, l, m]) => `<button class="btn${m ? ' main' : ''}" type="button" data-act="${a}">${l}</button>`).join('');
  const inIntro = state === 'start' || state === 'ready';   // 시작 화면 버튼은 가운데 묶음 안에
  $('introBtns').innerHTML = inIntro ? html : '';
  b.innerHTML = inIntro ? '' : html;
  b.classList.toggle('off', inIntro || !items.length);
}
let raf = 0, t0 = 0, arrived = false;
function play() {
  cancelAnimationFrame(raf); buildTL(); showArrive(false); arrived = false;
  $('intro').classList.add('off'); $('hud').classList.remove('on'); setBar('climb'); $('err').textContent = '';
  t0 = performance.now();
  const loop = now => {
    const td = now - t0, k = Math.min(1, td / DROP_MS);          // 1) 빈 하늘에서 땅으로 내려옴 2) 올라가기 시작
    DROP = H * Math.pow(1 - k, 3); if (k >= 1 && !arrived) $('hud').classList.add('on');
    const t = Math.max(0, td - DROP_MS); frame(t);
    if (!arrived && t > TL.climbEnd + END_HOLD) { arrived = true; showArrive(true); buildResult(); setBar('arrived'); }
    if (td < DROP_MS + TL.climbEnd + END_HOLD + 50) raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}
function fakeAnalyze() {   // 데모: '분석 중' 화면을 잠깐 보여주고 예시 데이터로 재생
  setBar('none'); $('anal').classList.add('on');
  const dur = 1600, s0 = performance.now();
  const tick = now => {
    const k = Math.min(1, (now - s0) / dur), e = 1 - Math.pow(1 - k, 2);
    $('analN').textContent = `${Math.round(e * 100)}%`; $('analBar').style.width = (e * 100) + '%';
    if (k < 1) requestAnimationFrame(tick);
    else setTimeout(() => { $('anal').classList.remove('on'); $('fileCard').classList.remove('on'); data = { ...EXAMPLE }; play(); }, 350);
  };
  requestAnimationFrame(tick);
}
function showStart() { cancelAnimationFrame(raf); buildTL(); DROP = H + 40; frame(0); $('intro').classList.remove('off'); $('hud').classList.remove('on'); showArrive(false); setBar('start'); }
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'pick') {   // 데모: 실제 파일 선택 없이 '파일을 올려둔 화면'으로 전환
    const d = EXAMPLE, f = s => s.replace(/-/g, '.');
    $('fileMeta').textContent = `8.4MB · ${f(d.from).slice(2)}~${f(d.to).slice(2)}`;
    $('fileCard').classList.add('on'); setBar('ready');
  }
  if (act === 'analyze') fakeAnalyze();
  if (act === 'example') { data = { ...EXAMPLE }; play(); }
  if (act === 'replay') { window.scrollTo({ top: 0, behavior: 'smooth' }); play(); }
  if (act === 'result') $('res').scrollIntoView({ behavior: 'smooth' });
});
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  try {
    const s = await f.text(), ts = s.trimStart().startsWith('[') ? parseJson(s) : parseHtml(s);
    if (ts.length < 2) throw new Error('시청 기록을 찾지 못했어요. 테이크아웃의 "시청 기록" 파일이 맞는지 확인해 주세요.');
    data = summarize(ts); window.scrollTo({ top: 0 }); play();
  } catch (x) { $('err').textContent = x.message || '파일을 읽지 못했어요.'; }
};
addEventListener('resize', () => { layout(); if (!TL) return; if (DROP > 0.5 && !raf) DROP = H + 40; frame(arrived ? TL.climbEnd + END_HOLD : 0); });
// 테스트용: 특정 시점 화면 고정
window.__seek = t => { cancelAnimationFrame(raf); if (!data) data = { ...EXAMPLE }; buildTL(); DROP = 0; $('intro').classList.add('off'); $('hud').classList.add('on'); frame(t);
  const done = t > TL.climbEnd + END_HOLD; showArrive(done); if (done) { buildResult(); setBar('arrived'); } else setBar('climb'); return { h: hAt(t), climbEnd: TL.climbEnd }; };
window.__start = showStart;
window.__setData = d => { data = d; };
window.__thin = () => { const all = OBJECTS.filter(o => o.kind !== 'line' && o.h <= TL.dist); const sh = all.filter(o => TL.shown.has(o)); const ts = sh.map(o => passTime(o.h)); const gaps = ts.slice(1).map((t, i) => t - ts[i]); return { km: +(TL.dist / 1000).toFixed(2), sec: +(TL.climbEnd / 1000).toFixed(1), passed: all.length, shown: sh.length, minGap: Math.round(Math.min(...gaps)), names: sh.map(o => o.name).join(',') }; };
layout();
Promise.all([document.fonts.load('18px Jua'), document.fonts.load('700 16px Gaegu')]).catch(() => {}).finally(() => showStart());
SHORT_IMGS.forEach(im => im.onload = () => { if (!raf || arrived) frame(arrived ? TL.climbEnd + END_HOLD : 0); });
catImg.onload = () => { if (!raf || arrived) frame(arrived ? TL.climbEnd + END_HOLD : 0); };
showStart();
</script>
